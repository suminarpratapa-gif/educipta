<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduCipta | Modul Ajar Animatif</title>
<style>
:root{--ink:#14202b;--ink2:#43525f;--paper:#eaeff4;--white:#fbfcfd;--accent:#5a3ea8;--sans:'Segoe UI',system-ui,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--sans)}
.wrap{max-width:860px;margin:0 auto;padding:56px 20px 80px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 10px}
p.lead{color:var(--ink2);max-width:60ch;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:block;padding:18px 20px;background:var(--white);border:1.5px solid var(--ink);text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
a.card b{display:block;font-size:18px;margin-bottom:4px}
a.card span{font-size:14px;color:var(--ink2)}
footer{margin-top:40px;padding-top:14px;border-top:1.5px solid var(--ink);font-size:13.5px;color:var(--ink2)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<h1>EduCipta</h1>
<p class="lead">Kumpulan modul ajar animatif dan interaktif. Pilih modul untuk mulai belajar.</p>
<div class="grid">
<a class="card" href="/modul_suminarpratapa/"><b>Modul Suminar Pratapa</b><span>Fisika II: Medan dan Gaya Listrik, 8 subbab dengan animasi interaktif dan kuis.</span></a>
<a class="card" href="/modul_contoh/"><b>Modul Contoh</b><span>Contoh modul yang belum diverifikasi, untuk percobaan dan peninjauan.</span></a>
</div>
<footer>Bagian dari <a href="https://aniviz.id">aniviz.id</a></footer>
</div>
</body>
</html>
